name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests

      # Crawls local fixture sites: redirects, canonicals, robots.txt,
      # pause/resume and resuming an interrupted crawl (tests/).
      - name: Crawler regression tests
        run: npm test
