name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs resume an unfinished draft release of an existing tag.
  # Published assets are immutable; a new version needs a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag of an unfinished draft release, e.g. v1.0.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Pins the release to one commit before anything is built: the tag that
  # was pushed, or the tag a manual run names. Refuses a tag that is
  # malformed or missing, or whose package.json versions don't match it,
  # so the installers below are built from that exact commit or not at all.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          # Via env, never interpolated into the script: the input is free text.
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "'$TAG' is not a release tag (vX.Y.Z)"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null) || fail "Tag $TAG does not exist in $GITHUB_REPOSITORY"
          type=$(jq -r .object.type <<<"$ref")
          sha=$(jq -r .object.sha <<<"$ref")
          # Annotated tags point at a tag object; peel it down to the commit.
          while [ "$type" = tag ]; do
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -r .object.type <<<"$obj")
            sha=$(jq -r .object.sha <<<"$obj")
          done
          [ "$type" = commit ] || fail "Tag $TAG points at a $type, not a commit"
          version="${TAG#v}"
          # Root: the CLI's version. apps/desktop: the installers' and the
          # update feed's. apps/cli: its own manifest. A release bumps all three.
          for f in package.json apps/desktop/package.json apps/cli/package.json; do
            v=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$sha" -H 'Accept: application/vnd.github.raw' | jq -r .version) \
              || fail "Cannot read $f at $TAG"
            [ "$v" = "$version" ] || fail "$f at $TAG ($sha) has version $v, expected $version"
          done
          # One draft also transports assets after their native smoke test.
          # Refuse to replace files belonging to an already published release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release.json 2>/dev/null; then
            [ "$(jq -r .isDraft release.json)" = true ] || fail "Release $TAG is already published"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$sha" --draft --title "$TAG" --generate-notes
          fi
          echo "Release $TAG builds commit $sha"
          { echo "tag=$TAG"; echo "sha=$sha"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  # Builds the three installers of the pinned commit, signed, and
  # smoke-tests each one on a machine of its own architecture.
  installers:
    needs: resolve
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      sign: true
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  # The draft stays invisible to the update feed until all three native
  # builds, signing, installer smoke tests and asset checks have passed.
  publish:
    needs: [resolve, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the draft assets and publish once
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha) || fail "Tag $TAG was deleted"
          [ "$now" = "$SHA" ] || fail "Tag $TAG moved during the build"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json
          [ "$(jq -r .isDraft release.json)" = true ] || fail "Release is no longer a draft"
          for suffix in \
            Windows-Setup.exe Windows-Setup.exe.blockmap Windows-Portable.exe \
            macOS-Apple-Silicon.dmg macOS-Apple-Silicon.dmg.blockmap \
            macOS-Intel.dmg macOS-Intel.dmg.blockmap \
            macOS-arm64.zip macOS-arm64.zip.blockmap \
            macOS-x64.zip macOS-x64.zip.blockmap; do
            name="EXIT-SEO-Crawler-$VERSION-$suffix"
            jq -e --arg name "$name" '.assets[] | select(.name == $name and .size > 0)' release.json >/dev/null || fail "$name is missing"
          done
          for platform in Windows.zip macOS-Apple-Silicon.tar.gz macOS-Intel.tar.gz; do
            name="EXIT-SEO-Crawler-CLI-$VERSION-$platform"
            jq -e --arg part "$name" '.assets[] | select(.name == $part and .size > 0)' release.json >/dev/null || fail "CLI $platform is missing"
          done
          mkdir manifests
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest*.yml' --dir manifests
          for manifest in latest.yml latest-mac.yml latest-mac-x64.yml; do
            [ -f "manifests/$manifest" ] || fail "$manifest is missing"
            tr -d '\r' < "manifests/$manifest" | grep -qxF "version: $VERSION" || fail "$manifest has the wrong version"
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
