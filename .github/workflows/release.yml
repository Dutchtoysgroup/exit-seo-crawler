name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs rebuild the assets of an existing release: pass its tag
  # and the run uploads into that release instead of one named after the
  # branch. Used when a run failed and "Re-run failed jobs" is no longer an
  # option. The build checks out the tag's commit, not the branch the run
  # was started from, so newer code on main can never ship under an older
  # version number.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Pins the release to one commit before anything is built: the tag that
  # was pushed, or the tag a manual run names. Refuses a tag that is
  # malformed or missing, or whose package.json versions don't match it,
  # so the installers below are built from that exact commit or not at all.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          # Via env, never interpolated into the script: the input is free text.
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "'$TAG' is not a release tag (vX.Y.Z)"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null) || fail "Tag $TAG does not exist in $GITHUB_REPOSITORY"
          type=$(jq -r .object.type <<<"$ref")
          sha=$(jq -r .object.sha <<<"$ref")
          # Annotated tags point at a tag object; peel it down to the commit.
          while [ "$type" = tag ]; do
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha")
            type=$(jq -r .object.type <<<"$obj")
            sha=$(jq -r .object.sha <<<"$obj")
          done
          [ "$type" = commit ] || fail "Tag $TAG points at a $type, not a commit"
          version="${TAG#v}"
          # Root: the CLI's version. apps/desktop: the installers' and the
          # update feed's. apps/cli: its own manifest. A release bumps all three.
          for f in package.json apps/desktop/package.json apps/cli/package.json; do
            v=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=$sha" -H 'Accept: application/vnd.github.raw' | jq -r .version) \
              || fail "Cannot read $f at $TAG"
            [ "$v" = "$version" ] || fail "$f at $TAG ($sha) has version $v, expected $version"
          done
          echo "Release $TAG builds commit $sha"
          { echo "tag=$TAG"; echo "sha=$sha"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  # Builds the three installers of the pinned commit, signed, and
  # smoke-tests each one on a machine of its own architecture.
  installers:
    needs: resolve
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      sign: true
      tag: ${{ needs.resolve.outputs.tag }}
    secrets: inherit

  # One publish, after every installer passed its smoke test: a release is
  # complete or absent, never half there, so the update feed never points
  # at a release without its Mac or Windows files. If a leg fails, re-run
  # the failed jobs of this run within 7 days (the installers that passed
  # stay with the run as artifacts until then), or start the workflow by
  # hand with the tag.
  publish:
    needs: [resolve, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Delete this run's installer artifacts once they are on the Release.
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer*'
          path: artifacts
          merge-multiple: true

      - name: Check tag and collect assets
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2>/dev/null) || fail "Tag $TAG was deleted during the build"
          [ "$now" = "$SHA" ] || fail "Tag $TAG moved from $SHA to $now during the build"
          mkdir dist
          find artifacts -type f -exec mv -n {} dist/ \;
          [ -z "$(find artifacts -type f)" ] || fail "Two artifacts share a file name"
          for want in latest.yml latest-mac.yml latest-mac-x64.yml; do
            [ -f "dist/$want" ] || fail "$want is missing"
          done
          ls -l dist
          echo "$(ls dist | wc -l) files for $TAG ($VERSION) at $SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      # The installers now live on the Release; the run's copies would only
      # fill the organisation's shared Actions storage until they expire. A
      # failure here leaves the release intact, so it does not fail the run.
      - name: Delete installer artifacts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | test("-installer")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "Deleted artifact $name ($id)"
          done
