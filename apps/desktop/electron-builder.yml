appId: com.dutchtoysgroup.exitseocrawler
productName: EXIT SEO Crawler
electronVersion: 41.2.2
# Update feed for electron-updater (written into the app as app-update.yml).
# The repo is private, so the public download page proxies the release:
# dashboard-exit.com/crawler/update serves latest.yml / latest-mac.yml and
# redirects installers, zips and blockmaps to GitHub (marketing-dashboard,
# src/app/crawler/update). The release workflow builds with --publish never
# and uploads the files to the GitHub release itself.
publish:
  provider: generic
  url: https://dashboard-exit.com/crawler/update
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  # The language detector loads only `eld/large`; the other three n-gram
  # databases are ~4.5 MB of dead weight in the installer. ELD is a module
  # singleton — one database per process — so the rest can never be reached.
  - "!node_modules/eld/src/ngrams/{extrasmall,small,medium}.js"
asar: true
# Release file names carry the platform and, where it matters, the CPU as
# plain words (Windows-Setup / Windows-Portable / macOS-Apple-Silicon /
# macOS-Intel / Linux-x86_64) so the Releases page needs no decoding.
# Hyphens, not spaces: GitHub rewrites spaces in asset URLs. The macOS
# name below is the local fallback (`-macOS-arm64` / `-macOS-x64`); the
# release workflow overrides it per architecture with the friendly words
# via `-c.mac.artifactName`, since one template cannot branch on arch.
# `pickInstallerAsset()` in src/main/index.ts matches both spellings.
asarUnpack:
  - "**/*.node"
# V2 Faz 1 — JS rendering. By default the Playwright browser cache is
# NOT bundled into the installer (saves ~250 MB). The main process
# prompts the user to download the browser on first JS-render crawl.
#
# To opt into bundling (offline installer / enterprise distribution):
#   1. Run `npm run playwright:install` so the cache exists locally.
#   2. Build with `BUNDLE_PLAYWRIGHT=1`:
#        $env:BUNDLE_PLAYWRIGHT='1'; npm --workspace apps/desktop run build:win
#      The build script copies `~/AppData/Local/ms-playwright` into
#      `apps/desktop/resources/playwright-browsers/` BEFORE
#      electron-builder runs, and the `extraResources` glob below picks
#      it up. When the env var is unset the resources folder is empty
#      and the glob no-ops.
extraResources:
  - from: "resources/playwright-browsers"
    to: "playwright-browsers"
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: EXIT-SEO-Crawler-${version}-Windows-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EXIT SEO Crawler
portable:
  artifactName: EXIT-SEO-Crawler-${version}-Windows-Portable.${ext}
mac:
  artifactName: EXIT-SEO-Crawler-${version}-macOS-${arch}.${ext}
  # No `arch` list here on purpose. electron-builder lets a config-side
  # arch list override the CLI's `--arm64` / `--x64` unless a target type
  # is also given on the CLI (computeArchToTargetNamesMap), so with
  # `arch: [arm64, x64]` every release leg built BOTH images — and once
  # both carried the same friendly name they overwrote each other. The
  # arch now comes from the CLI: the release workflow passes one per leg,
  # a local `npm run build:mac` builds the host arch, and
  # `npm run build:mac -- --arm64 --x64` builds both.
  # dmg for people, zip for electron-updater (Squirrel.Mac only takes zips).
  # The zip keeps the arch in its name — the updater picks the Apple-silicon
  # build by the word "arm64" — while the release workflow gives the dmg the
  # friendly Apple-Silicon / Intel name via -c.dmg.artifactName.
  target:
    - dmg
    - zip
  category: public.app-category.business
  # Developer ID signing + notarization (release workflow). The identity is
  # imported into a temporary keychain by the workflow; notarization runs
  # when APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are set. A local
  # build without that keychain identity falls back to an ad-hoc signature.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
linux:
  executableName: exit-seo-crawler
  artifactName: EXIT-SEO-Crawler-${version}-Linux-${arch}.${ext}
  target:
    - AppImage
    - deb
    - rpm
  category: Development
rpm:
  fpm:
    - "--name"
    - "exit-seo-crawler"
fileAssociations:
  - ext: seoproject
    name: EXIT SEO Crawler Project
    description: EXIT SEO Crawler crawl project
    role: Editor
